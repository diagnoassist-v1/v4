<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#193fa4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ملخص التقييم | DIAGNO-ASSIST</title>
<link rel="icon" type="image/jpeg" href="logo.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="nav-bar.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{--blue:#1a41ad;--blue-deep:#193fa4;--blue-light:#2b5be0;--sky:#1a44b5;--ink:#0b1c4d;--muted:#455a94;--line:#cbd7f7;--shadow:0 2px 12px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Readex Pro','Tajawal','Cairo',sans-serif;background:#e0f2fe;color:#1e293b;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}

@keyframes fadeInUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

header.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);background:linear-gradient(120deg,#0b1c4d,#193fa4 45%,#193fa4);border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 12px 36px rgba(11, 28, 77,.35)}
header.nav .brand-name{background:linear-gradient(120deg,#fff,#b6c8f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
header.nav .brand-sub{color:#bfd0fa}
header.nav .nav-links a{color:#d6e4ff}
header.nav .nav-links a::after{background:linear-gradient(90deg,#3b6cf5,#2b5be0)}
header.nav .nav-links a:hover{color:#fff}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:96px;gap:24px;width:auto;max-width:none;padding-inline:3%}
.brand{display:flex;align-items:center;gap:16px;text-decoration:none;flex-shrink:0}
.brand-logo{width:64px;height:64px;border-radius:20px;object-fit:cover;box-shadow:0 10px 26px rgba(26, 65, 173,.30),0 0 0 4px rgba(26, 65, 173,.08)}
.brand-text{line-height:1.15}
.brand-name{display:block;font-size:27px;font-weight:900;letter-spacing:.5px;background:linear-gradient(120deg,#193fa4,#1a41ad 55%,#1a44b5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{display:block;font-size:13.5px;font-weight:700;letter-spacing:.3px;margin-top:3px}
.nav-links{display:flex;gap:34px;align-items:center}
.nav-links a{text-decoration:none;font-weight:700;font-size:15.5px;position:relative;padding:6px 0;transition:color .25s}
.nav-links a::after{content:"";position:absolute;bottom:-2px;right:0;width:0;height:3px;border-radius:3px;transition:width .3s}
.nav-links a:hover::after{width:100%}
.nav-links a .ico{font-size:17px}
.nav-cta{padding:12px 28px;font-size:15px;border-radius:14px;background:linear-gradient(135deg,#1a41ad,#2b5be0);color:#fff;border:none;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 8px 24px rgba(26, 65, 173,.35);transition:all .25s}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(26, 65, 173,.45)}

.hero{background:linear-gradient(135deg,#0b1c4d 0%,#193fa4 50%,#1a41ad 100%);background-size:200% 200%;animation:gradientShift 8s ease infinite;padding:32px 24px 28px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60%;left:-20%;width:140%;height:200%;background:radial-gradient(ellipse,rgba(255,255,255,.06) 0%,transparent 60%);pointer-events:none}
.hero::after{content:'';position:absolute;bottom:-40%;right:-10%;width:60%;height:120%;background:radial-gradient(circle,rgba(6,182,212,.15) 0%,transparent 50%);pointer-events:none}
.hero .container{position:relative;z-index:1;text-align:center}
.breadcrumb{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.78rem;color:rgba(255,255,255,.55);margin-bottom:14px}
.breadcrumb a{color:rgba(255,255,255,.6);transition:color .2s}
.breadcrumb a:hover{color:#fff}
.hero-title{font-size:1.6rem;font-weight:900;margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.2);text-align:center}
.hero-subtitle{font-size:1rem;font-weight:600;color:rgba(255,255,255,.8);margin-bottom:16px;text-align:center}
.hero-stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.hero-stat{background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 18px;display:flex;align-items:center;gap:8px;transition:transform .25s,background .25s}
.hero-stat:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
.hero-stat .stat-icon{font-size:1.3rem}
.hero-stat .stat-label{font-size:.72rem;color:rgba(255,255,255,.6);display:block}
.hero-stat .stat-value{font-size:.92rem;font-weight:800;color:#fff}
.hero-stat-time{background:linear-gradient(135deg,#16a34a,#15803d);border-color:rgba(255,255,255,.28);box-shadow:0 6px 18px rgba(22,163,74,.28)}
.hero-stat-time:hover{background:linear-gradient(135deg,#15803d,#166534)}
.hero-stat-time .stat-label{color:#d1fae5}
.hero-stat-time .stat-icon{filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}

.main-grid{max-width:800px;margin:0 auto;padding:24px 16px 40px;display:grid;grid-template-columns:1fr;gap:24px}
.col-main{display:flex;flex-direction:column;gap:20px}
.col-side{display:none}

.card{background:#fff;border-radius:20px;padding:24px;box-shadow:var(--shadow);border:1px solid #f1f5f9;transition:transform .3s,box-shadow .3s;animation:fadeInUp .5s ease both}
.card:nth-child(1){animation-delay:.05s}
.card:nth-child(2){animation-delay:.1s}
.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.2s}
.card:nth-child(5){animation-delay:.25s}
.card:nth-child(6){animation-delay:.3s}
.card:nth-child(7){animation-delay:.35s}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 24px rgba(0,0,0,.08)}
.card-title{font-size:1.05rem;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px;color:#1e293b}

.overview{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.overview-text{flex:1;min-width:180px}
.overview-text .big-score{font-size:2.4rem;font-weight:900;color:var(--blue);line-height:1.1}
.overview-text .severity-badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:.85rem;font-weight:700;margin-top:8px;transition:transform .2s}
.overview-text .severity-badge:hover{transform:scale(1.05)}
.overview-text .desc{font-size:.88rem;color:var(--muted);margin-top:8px;line-height:1.6}

.dim-list{display:flex;flex-direction:column;gap:14px}
.dim-item{display:flex;align-items:center;gap:12px;padding:6px 0;transition:transform .2s}
.dim-item:hover{transform:translateX(-4px)}
.dim-rank{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.dim-info{flex:1}
.dim-name{font-weight:700;font-size:.9rem;margin-bottom:5px}
.dim-bar-wrap{background:#e8edf5;border-radius:8px;height:8px;overflow:hidden}
.dim-bar{height:100%;border-radius:8px;transition:width 1s cubic-bezier(.22,1,.36,1)}
.dim-score{font-size:.82rem;font-weight:800;color:var(--muted);white-space:nowrap;min-width:36px;text-align:left}

.chart-wrap{position:relative;width:100%;min-height:360px;border-radius:12px;overflow:hidden;padding:8px}

.last-result{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.last-score{font-size:2rem;font-weight:900;color:var(--blue)}
.last-diff{display:flex;align-items:center;gap:4px;font-size:.88rem;font-weight:700;padding:4px 12px;border-radius:10px}
.last-diff.up{color:#dc2626;background:#fef2f2}
.last-diff.down{color:#16a34a;background:#f0fdf4}
.last-diff.stable{color:#d97706;background:#fffbeb}

.info-box{background:#eef2fe;border:1px solid #b6c8f9;border-radius:14px;padding:16px;font-size:.88rem;line-height:1.9;color:#193fa4}
.disclaimer-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:16px;font-size:.84rem;line-height:1.9;color:#9a3412;display:flex;gap:12px;align-items:flex-start}
.disclaimer-box svg{flex-shrink:0;margin-top:2px;width:22px;height:22px;color:#d97706}

.action-buttons{display:flex;gap:14px;flex-wrap:wrap}
.action-buttons button{flex:1;min-width:140px;padding:14px;border-radius:14px;font-family:inherit;font-weight:700;font-size:.92rem;border:none;cursor:pointer;transition:all .25s;display:flex;align-items:center;justify-content:center;gap:10px}
.action-buttons button svg{width:20px;height:20px;flex-shrink:0}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;box-shadow:0 6px 20px rgba(26, 65, 173,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(26, 65, 173,.4)}
.btn-outline{background:#fff;color:var(--blue);border:2px solid var(--line)}
.btn-outline:hover{background:var(--line);border-color:var(--blue-light);transform:translateY(-3px)}
.btn-save-result{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 6px 20px rgba(22,163,74,.3)}
.btn-save-result:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(22,163,74,.4)}
.btn-save-result:disabled{opacity:.7;cursor:wait;transform:none}

.severity-breakdown{display:flex;flex-direction:column;gap:8px}
.sev-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#f8fafc;transition:all .2s}
.sev-row:hover{background:#f1f5f9;transform:translateX(-3px)}
.sev-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.sev-label{flex:1;font-size:.88rem;font-weight:700}
.sev-value{font-size:.82rem;font-weight:700;color:var(--muted)}

.footer{background:linear-gradient(135deg,var(--ink),#193fa4);color:rgba(255,255,255,.55);text-align:center;padding:28px 16px;font-size:.8rem;margin-top:0}
.footer a{color:#2b5be0;font-weight:700;transition:color .2s}
.footer a:hover{color:#fff}
.no-sessions{text-align:center;padding:36px;color:var(--muted);font-size:.95rem}

@media(max-width:800px){
  .nav-links{display:none}
  .nav-inner{padding-inline:4%}
  .hero{padding:24px 16px 20px}
  .hero-title{font-size:1.3rem}
  .hero-stats{gap:8px}
  .hero-stat{padding:8px 12px}
}
@media(max-width:640px){
  .main-grid{padding:20px 12px 36px}
  .card{padding:20px}
  .overview{flex-direction:column-reverse}
  .action-buttons{flex-direction:column}
  .action-buttons button{width:100%}
}
@media(max-width:430px){
  .brand-logo{width:40px;height:40px;border-radius:12px}
  .brand-name{font-size:16px}
  .brand-sub{font-size:9.5px}
  .brand{gap:8px}
  .nav-cta{padding:7px 12px;font-size:11px;border-radius:8px}
  .nav-inner{height:auto;min-height:64px;padding-inline:3%;gap:8px}
  .hero{padding:14px 12px 12px}
  .hero-title{font-size:1.05rem}
  .hero-subtitle{font-size:.82rem}
  .hero-stats{gap:5px}
  .hero-stat{padding:5px 8px;border-radius:8px;gap:5px}
  .hero-stat .stat-icon{font-size:.9rem}
  .hero-stat .stat-value{font-size:.78rem}
  .main-grid{padding:10px 8px 24px;gap:14px}
  .card{padding:14px;border-radius:14px}
  .card-title{font-size:.9rem;margin-bottom:10px}
  .overview{gap:10px}
  .overview-text .big-score{font-size:1.6rem}
  .overview-text{min-width:unset}
  .dim-item:hover{transform:none}
  .dim-score{min-width:28px;font-size:.75rem}
  .dim-name{font-size:.8rem}
  .chart-wrap{min-height:220px;padding:4px}
  .last-result{gap:8px}
  .last-score{font-size:1.4rem}
  .last-diff{font-size:.78rem;padding:3px 8px}
  .info-box{padding:10px;font-size:.8rem;line-height:1.7}
  .disclaimer-box{padding:10px;gap:8px;font-size:.76rem;line-height:1.7}
  .disclaimer-box svg{width:16px;height:16px}
  .action-buttons button{padding:10px;border-radius:10px;font-size:.82rem;gap:6px}
  .action-buttons button svg{width:16px;height:16px}
  .sev-row{padding:8px;border-radius:8px}
  .sev-row:hover{transform:none}
  .footer{padding:18px 10px}
  .progress-nav .step{padding:5px 7px}
  .progress-nav .step .step-icon{width:20px;height:20px;font-size:9px}
  .progress-nav .step-connector{width:6px}
}

/* ==========================================================================
   DIAGNO-ASSIST — 3D NEURO-GLASS & ORBITAL STUDIO (ROYAL COBALT #1a41ad EDITION)
   Anchored in exact swatch colors: #193fa4 -> #1a41ad -> #1a44b5
   ========================================================================== */
:root {
    --cobalt-core: #1a41ad;
    --cobalt-left: #193fa4;
    --cobalt-right: #1a44b5;
    --cobalt-bright: #2b5be0;
    --cobalt-deep: #122d7a;
    --cobalt-navy: #0b1c4d;
    --cobalt-ice: #edf1fc;
    --cobalt-border: #c5d3f7;
    --blue: #1a41ad !important;
    --blue-deep: #193fa4 !important;
    --blue-mid: #1a44b5 !important;
    --blue-light: #2b5be0 !important;
    --blue-pale: #e3eafd !important;
    --primary: #1a41ad !important;
    --primary-dark: #193fa4 !important;
    --primary-light: #2b5be0 !important;
    --sky: #1a44b5 !important;
    --teal: #1a41ad !important;
    --teal-deep: #193fa4 !important;
    --teal-soft: #eef2fe !important;
    --rose: #1a41ad !important;
    --rose-deep: #193fa4 !important;
    --rose-soft: #eef2fe !important;
    --navy: #11286b !important;
    --navy-dark: #0b1c4d !important;
    --dark: #0b1c4d !important;
    --dark-mid: #11286b !important;
    --ink: #0b1c4d !important;
    --text: #11286b !important;
    --text-dark: #0b1c4d !important;
    --text-mid: #283e7a !important;
    --text-light: #455a94 !important;
    --text-lighter: #6478ad !important;
    --muted: #455a94 !important;
    --slate: #1f346e !important;
    --slate-light: #455a94 !important;
    --line: #cbd7f7 !important;
    --border: #cbd7f7 !important;
    --bg: #e0f2fe !important;
    --grad-start: #122d7a !important;
    --grad-mid: #193fa4 !important;
    --grad-end: #1a44b5 !important;
    --card-radius: 28px !important;
    --radius: 28px !important;
}

@keyframes neuroReveal {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}

.reveal, .fade-up, .plan, .pay-header, .card-3d, .pay-form {
    opacity: 1 !important;
    transform: none !important;
    animation: neuroReveal 0.55s cubic-bezier(0.22, 1, 0.36, 1) both !important;
}

/* 1. ARCHITECTURAL BLUEPRINT GRID & LIGHT SKY-BLUE CANVAS */
body {
    font-family: 'Tajawal', 'Readex Pro', 'Cairo', sans-serif !important;
    background-color: #e0f2fe !important;
    background-image:
        radial-gradient(circle at 10% 12%, rgba(56, 189, 248, 0.20) 0%, transparent 38%),
        radial-gradient(circle at 90% 18%, rgba(14, 165, 233, 0.15) 0%, transparent 42%),
        radial-gradient(circle at 50% 90%, rgba(125, 211, 252, 0.25) 0%, transparent 45%),
        linear-gradient(to right, rgba(14, 165, 233, 0.075) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(14, 165, 233, 0.075) 1px, transparent 1px),
        linear-gradient(160deg, #f0f9ff 0%, #dff2fe 52%, #e6f6ff 100%) !important;
    background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px, 32px 32px, 100% 100% !important;
    background-attachment: fixed !important;
    color: #0b1c4d !important;
    position: relative;
}

.bg-fx { background: transparent !important; }

h1, h2, h3, h4, .brand-name, .hero-title, .header-title, .card-title, .section-title, .modal-title {
    font-family: 'Readex Pro', 'Tajawal', 'Cairo', sans-serif !important;
    letter-spacing: -0.2px;
}

.bg-blob.blob-1, .orb-1 { background: #7dd3fc !important; opacity: 0.28 !important; }
.bg-blob.blob-2, .orb-2 { background: #38bdf8 !important; opacity: 0.20 !important; }
.orb-3 { background: #bae6fd !important; opacity: 0.30 !important; }

/* 2. FLOATING 3D LOGO-INSPIRED CYAN-AZURE CAPSULE NAVBAR (#34bae6 -> #219ad5 -> #0b69b4) */
header.nav {
    position: sticky !important;
    top: 12px !important;
    z-index: 200 !important;
    width: 97% !important;
    max-width: none !important;
    margin: 12px auto 0 !important;
    border-radius: 999px !important;
    background-color: #219ad5 !important;
    background-image:
        radial-gradient(circle at 14% 22%, rgba(52, 186, 230, 0.65) 0%, transparent 45%),
        radial-gradient(circle at 86% 80%, rgba(9, 103, 175, 0.65) 0%, transparent 50%),
        linear-gradient(125deg, #0967af 0%, #0b69b4 30%, #219ad5 66%, #34bae6 100%) !important;
    backdrop-filter: blur(24px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(24px) saturate(180%) !important;
    border: 2.5px solid rgba(255, 255, 255, 0.94) !important;
    box-shadow: 0 20px 46px -10px rgba(9, 103, 175, 0.40),
                0 0 0 1.5px rgba(33, 154, 213, 0.48),
                inset 0 2px 5px rgba(255, 255, 255, 0.55),
                inset 0 -3px 8px rgba(9, 103, 175, 0.42) !important;
    padding: 0 10px !important;
}
header.nav .nav-inner,
header.nav .container.nav-inner {
    height: 74px !important;
    padding-inline: 24px !important;
    width: 100% !important;
    max-width: none !important;
}
header.nav .brand-logo {
    width: 50px !important;
    height: 50px !important;
    border-radius: 16px !important;
    object-fit: cover;
    border: 2.5px solid #ffffff !important;
    box-shadow: 0 8px 20px rgba(7, 82, 142, 0.42),
                0 0 0 3px rgba(255, 255, 255, 0.30) !important;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1) !important;
}
header.nav .brand:hover .brand-logo {
    transform: scale(1.07) rotate(-4deg) !important;
}
header.nav .brand-name {
    font-size: 22px !important;
    font-weight: 900 !important;
    background: linear-gradient(180deg, #ffffff 0%, #e0f7ff 100%) !important;
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: transparent !important;
    filter: drop-shadow(0 2px 6px rgba(7, 82, 142, 0.32)) !important;
}
header.nav .brand-sub {
    color: #e6f8ff !important;
    font-size: 11.5px !important;
    font-weight: 700 !important;
}
header.nav .nav-links {
    background: rgba(255, 255, 255, 0.18) !important;
    backdrop-filter: blur(14px) !important;
    -webkit-backdrop-filter: blur(14px) !important;
    border: 1.5px solid rgba(255, 255, 255, 0.48) !important;
    padding: 5px 7px !important;
    border-radius: 999px !important;
    gap: 6px !important;
    box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.38), 0 6px 16px rgba(7, 82, 142, 0.20) !important;
}
header.nav .nav-links a {
    color: #ffffff !important;
    font-size: 13.5px !important;
    font-weight: 800 !important;
    padding: 7px 16px !important;
    border-radius: 999px !important;
    text-shadow: 0 1px 3px rgba(7, 82, 142, 0.32) !important;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1) !important;
}
header.nav .nav-links a::after { display: none !important; }
header.nav .nav-links a:hover {
    background: #ffffff !important;
    color: #0967af !important;
    text-shadow: none !important;
    box-shadow: 0 6px 16px rgba(7, 82, 142, 0.28) !important;
    transform: translateY(-1px);
}
header.nav .nav-cta, header.nav .btn-primary.nav-cta {
    background: linear-gradient(180deg, #ffffff 0%, #ecf9ff 100%) !important;
    color: #0967af !important;
    border-radius: 999px !important;
    padding: 10px 24px !important;
    font-size: 14px !important;
    font-weight: 900 !important;
    border: 2px solid #ffffff !important;
    box-shadow: 0 8px 22px rgba(7, 82, 142, 0.35),
                0 0 0 3px rgba(255, 255, 255, 0.28),
                inset 0 2px 3px #ffffff !important;
}
header.nav .nav-cta:hover {
    background: #ffffff !important;

  var DIM_LABELS=['الاقتحام والارتجاع','التجنّب','التغيرات المعرفية','الإثارة والفرط التحفزي','الجسدي والوجدانية السلبية','خلل التنظيم الانفعالي والسلوكي','المفهوم السلبي المشوه عن الذات','الاختلال في العلاقات'];

  function ptKey(base){
    var p=null;
    try{p=JSON.parse(localStorage.getItem('diagActivePatient'))}catch(e){}
    return p? base+'_'+p.id : base;
  }
  function getTest(){return localStorage.getItem(ptKey('activeChartTest'))||'ptsd'}
  function getItems(test){return test==='mdd'?MDD_ITEMS:PTSD_ITEMS}
  function getSessions(test){
    var k=test==='mdd'?ptKey('diagSessionsMddV2'):ptKey('diagSessionsV2');
    try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}
  }
  function getThresholds(test){
    if(test==='mdd')return{MAX:256,MID:129,HIGH:193};
    return{MAX:376,MID:189,HIGH:283};
  }
  function stateLabel(total,th){
    if(total>=th.HIGH)return'مرتفعة';
    if(total>=th.MID)return'متوسطة';
    return'ضعيفة';
  }
  function stateColor(total,th){
    if(total>=th.HIGH)return'#16a34a';
    if(total>=th.MID)return'#d97706';
    return'#dc2626';
  }
  function stateBg(total,th){
    if(total>=th.HIGH)return'#16a34a22';
    if(total>=th.MID)return'#d9770622';
    return'#dc262622';
  }
  function calcDims(session,test){
    var items=getItems(test);
    var numDims=8;
    var chunkSize=Math.ceil(items.length/numDims);
    var dims=[];
    for(var c=0;c<numDims;c++){
      var chunk=session.answers.slice(c*chunkSize,(c+1)*chunkSize);
      var sum=0;
      for(var i=0;i<chunk.length;i++)sum+=chunk[i].score||0;
      var maxS=chunkSize*4;
      var score3=maxS>0?Math.round(sum/maxS*30)/10:0;
      dims.push({name:DIM_LABELS[c],pct:maxS>0?Math.round(sum/maxS*100):0,score3:score3});
    }
    return dims;
  }

  function makeSession(number,date,total,items){
    var extra=total-items.length;
    var scores=[];
    for(var i=0;i<items.length;i++)scores.push(1);
    for(var i=0;i<extra;i++)scores[(i*37)%items.length]++;
    var answers=items.map(function(text,idx){
      var score=scores[idx];
      var label=score===1?'يوميًا تقريبًا':score===2?'نصف الأيام':score===3?'أيام قليلة فقط':'لم يحدث أبدًا';
      return{no:idx+1,text:text,label:label,score:score};
    });
    var max=items.length*4;
    var th=getThresholds(getTest());
    var state=total>=th.HIGH?'مرتفعة':total>=th.MID?'متوسطة':'ضعيفة';
    return{number:number,date:date,total:total,max:max,avg:Math.round(total/items.length*100)/100,pct:Math.round(total/max*100),state:state,answers:answers};
  }

  function formatDuration(sec){
    sec=parseInt(sec,10);
    if(!sec||sec<0)return '—';
    var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
    function p(n){return(n<10?'0':'')+n}
    return (h>0?h+':'+p(m):p(m))+':'+p(s);
  }

  function seedSessions(t){
    var items=getItems(t);
    var seeds=t==='mdd'
      ?[[1,'01/07/2026',78],[2,'12/07/2026',96],[3,'19/07/2026',132],[4,'26/07/2026',160]]
      :[[1,'01/07/2026',112],[2,'12/07/2026',158],[3,'19/07/2026',224],[4,'26/07/2026',271]];
    var arr=[];
    for(var i=0;i<seeds.length;i++){
      arr.push(makeSession(seeds[i][0],seeds[i][1],seeds[i][2],items));
    }
    return arr;
  }

  document.getElementById('heroStats').innerHTML=
    '<div class="hero-stat"><span class="stat-icon">📋</span><div><span class="stat-label">النسبة</span><span class="stat-value">'+last.pct+'%</span></div></div>'+
    '<div class="hero-stat"><span class="stat-icon">🔬</span><div><span class="stat-label">الجلسات</span><span class="stat-value">'+sessions.length+'</span></div></div>'+
    '<div class="hero-stat"><span class="stat-icon">📅</span><div><span class="stat-label">آخر جلسة</span><span class="stat-value">'+last.date+'</span></div></div>'+
    '<div class="hero-stat"><span class="stat-icon">⚡</span><div><span class="stat-label">الشدة</span><span class="stat-value">'+last.state+'</span></div></div>'+
    '<div class="hero-stat hero-stat-time"><span class="stat-icon">⏱</span><div><span class="stat-label">مدة الاختبار</span><span class="stat-value">'+formatDuration(last.duration)+'</span></div></div>';

  document.getElementById('overviewCard').innerHTML=
    '<div class="card-title">📋 شدة الاضطراب</div>'+
    '<div class="overview">'+
    '<div class="overview-text">'+
    '<div class="big-score">'+last.pct+'%</div>'+
    '<div class="severity-badge" style="background:'+sevBg+';color:'+sevColor+'">'+last.state+'</div>'+
    '<div class="desc">آخر نتيجة مسجلة من جلسة رقم '+last.number+'</div>'+
    '</div>'+
    '</div>';

  var dimHtml='<div class="card-title">🎯 الأبعاد الأكثر بروزًا</div><div class="dim-list">';
  var dimColors=['#dc2626','#d97706','#2563eb','#8b5cf6','#16a34a','#06b6d4','#f59e0b','#ec4899'];
  for(var i=0;i<sorted.length;i++){
    var d=sorted[i];
    var c=dimColors[i]||dimColors[4];
    dimHtml+='<div class="dim-item">'+
      '<div class="dim-rank" style="background:'+c+'">'+(i+1)+'</div>'+
      '<div class="dim-info"><div class="dim-name">'+d.name+'</div>'+
      '<div class="dim-bar-wrap"><div class="dim-bar" style="width:'+d.pct+'%;background:linear-gradient(90deg,'+c+','+c+'cc)"></div></div></div>'+
      '<div class="dim-score">'+d.pct+'%</div>'+
      '</div>';
  }
  dimHtml+='</div>';
  document.getElementById('topDimCard').innerHTML=dimHtml;

  var top3Html='<div class="card-title">🏆 أبرز 3 أبعاد</div><div class="dim-list">';
  var medals=['🥇','🥈','🥉'];
  for(var i=0;i<Math.min(3,sorted.length);i++){
    var d=sorted[i];
    top3Html+='<div class="dim-item">'+
      '<div class="dim-rank" style="background:#2563eb;font-size:1.1rem">'+medals[i]+'</div>'+
      '<div class="dim-info"><div class="dim-name">'+d.name+'</div></div>'+
      '<div class="dim-score" style="color:#2563eb">'+d.pct+'%</div>'+
      '</div>';
  }
  top3Html+='</div>';
  document.getElementById('top3Card').innerHTML=top3Html;

  if(sessions.length===1){
    document.getElementById('trendMessage').innerHTML='<div class="no-sessions">هذه جلستك الأولى. قم بإجراء جلسات إضافية لرؤية تطور النسبة.</div>';
  }else{
    var tLabels=sessions.map(function(s){return'الجلسة '+s.number});
    var tData=sessions.map(function(s){return s.pct});

    var bgPlugin={
      id:'bgZones',
      beforeDraw:function(chart){
        var ctx=chart.ctx;
        var yAxis=chart.scales.y;
        var xAxis=chart.scales.x;
        var top=yAxis.top;
        var bottom=yAxis.bottom;
        var left=xAxis.left;
        var right=xAxis.right;
        var h=bottom-top;
        var pctHigh=(th.HIGH/th.MAX)*100;
        var pctMid=(th.MID/th.MAX)*100;
        ctx.save();
        ctx.globalAlpha=0.1;
        ctx.fillStyle='#16a34a';
        ctx.fillRect(left,top,right-left,h*(1-pctHigh/100));
        ctx.fillStyle='#d97706';
        ctx.fillRect(left,top+h*(1-pctHigh/100),right-left,h*(pctHigh-pctMid)/100);
        ctx.fillStyle='#dc2626';
        ctx.fillRect(left,top+h*(1-pctMid/100),right-left,h*pctMid/100);
        ctx.restore();
      }
    };

    new Chart(document.getElementById('trendChart'),{
      type:'line',
      data:{labels:tLabels,datasets:[
        {label:'النسبة',data:tData,borderColor:'#2563eb',backgroundColor:'#2563eb',borderWidth:3,pointRadius:5,pointBackgroundColor:tData.map(function(p){
          var total=Math.round(p/100*th.MAX);
          return stateColor(total,th);
        }),tension:.3,fill:false}
      ]},
      options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.parsed.y+'%'}}}},scales:{y:{beginAtZero:true,max:100,grid:{color:'#f1f5f9'},ticks:{font:{family:'Cairo',size:11},callback:function(v){return v+'%'}}},x:{grid:{display:false},ticks:{font:{family:'Cairo',size:10},maxRotation:45}}}},
      plugins:[bgPlugin]
    });
  }

  var btnReport=document.getElementById('btnReport');
  if(btnReport)btnReport.onclick=function(){window.open('AssessmentReport.html?autoPrint=1','_blank','width=800,height=1000')};
  document.getElementById('btnPrint').onclick=function(){window.open('AssessmentReport.html?autoPrint=1','_blank','width=800,height=1000')};

  wireAuth();
})();
</script>
</body>
</html>
